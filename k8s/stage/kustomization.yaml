apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecommerce-stage

resources:
  - namespace.yaml
  - ../dev/service-discovery-deployment.yaml
  - ../dev/service-discovery-service.yaml
  - ../dev/cloud-config-deployment.yaml
  - ../dev/cloud-config-service.yaml
  - ../dev/zipkin-deployment.yaml
  - ../dev/zipkin-service.yaml
  - ../dev/api-gateway-deployment.yaml
  - ../dev/api-gateway-service.yaml
  - ../dev/proxy-client-deployment.yaml
  - ../dev/proxy-client-service.yaml
  - ../dev/user-service-deployment.yaml
  - ../dev/user-service-service.yaml
  - ../dev/product-service-deployment.yaml
  - ../dev/product-service-service.yaml
  - ../dev/order-service-deployment.yaml
  - ../dev/order-service-service.yaml
  - ../dev/payment-service-deployment.yaml
  - ../dev/payment-service-service.yaml
  - ../dev/shipping-service-deployment.yaml
  - ../dev/shipping-service-service.yaml
  - ../dev/favourite-service-deployment.yaml
  - ../dev/favourite-service-service.yaml

commonLabels:
  environment: staging

# Reemplazar imágenes - Docker Hub
# El workflow reemplazará DOCKER_USERNAME y IMAGE_TAG dinámicamente
images:
  - name: selimhorri/service-discovery-ecommerce-boot
    newName: DOCKER_USERNAME/service-discovery-ecommerce-boot
    newTag: IMAGE_TAG
  - name: selimhorri/cloud-config-ecommerce-boot
    newName: DOCKER_USERNAME/cloud-config-ecommerce-boot
    newTag: IMAGE_TAG
  - name: selimhorri/api-gateway-ecommerce-boot
    newName: DOCKER_USERNAME/api-gateway-ecommerce-boot
    newTag: IMAGE_TAG
  - name: selimhorri/proxy-client-ecommerce-boot
    newName: DOCKER_USERNAME/proxy-client-ecommerce-boot
    newTag: IMAGE_TAG
  - name: selimhorri/user-service-ecommerce-boot
    newName: DOCKER_USERNAME/user-service-ecommerce-boot
    newTag: IMAGE_TAG
  - name: selimhorri/product-service-ecommerce-boot
    newName: DOCKER_USERNAME/product-service-ecommerce-boot
    newTag: IMAGE_TAG
  - name: selimhorri/favourite-service-ecommerce-boot
    newName: DOCKER_USERNAME/favourite-service-ecommerce-boot
    newTag: IMAGE_TAG
  - name: selimhorri/order-service-ecommerce-boot
    newName: DOCKER_USERNAME/order-service-ecommerce-boot
    newTag: IMAGE_TAG
  - name: selimhorri/payment-service-ecommerce-boot
    newName: DOCKER_USERNAME/payment-service-ecommerce-boot
    newTag: IMAGE_TAG
  - name: selimhorri/shipping-service-ecommerce-boot
    newName: DOCKER_USERNAME/shipping-service-ecommerce-boot
    newTag: IMAGE_TAG

patches:
  # Patch para servicios que necesitan Eureka (api-gateway, proxy-client, business services)
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: SPRING_PROFILES_ACTIVE
            value: "stage"
          - name: SPRING_ZIPKIN_BASE_URL
            value: "http://zipkin-service:9411/"
          - name: SPRING_CONFIG_IMPORT
            value: "optional:configserver:http://cloud-config:9296"
          - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
            value: "http://service-discovery:8761/eureka"
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  
  - target:
      kind: Deployment
      name: proxy-client
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: SPRING_PROFILES_ACTIVE
            value: "stage"
          - name: SPRING_ZIPKIN_BASE_URL
            value: "http://zipkin-service:9411/"
          - name: SPRING_CONFIG_IMPORT
            value: "optional:configserver:http://cloud-config:9296"
          - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
            value: "http://service-discovery:8761/eureka"
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: SPRING_PROFILES_ACTIVE
            value: "stage"
          - name: SPRING_ZIPKIN_BASE_URL
            value: "http://zipkin-service:9411/"
          - name: SPRING_CONFIG_IMPORT
            value: "optional:configserver:http://cloud-config:9296"
          - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
            value: "http://service-discovery:8761/eureka"
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  
  - target:
      kind: Deployment
      name: product-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: SPRING_PROFILES_ACTIVE
            value: "stage"
          - name: SPRING_ZIPKIN_BASE_URL
            value: "http://zipkin-service:9411/"
          - name: SPRING_CONFIG_IMPORT
            value: "optional:configserver:http://cloud-config:9296"
          - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
            value: "http://service-discovery:8761/eureka"
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  
  - target:
      kind: Deployment
      name: order-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: SPRING_PROFILES_ACTIVE
            value: "stage"
          - name: SPRING_ZIPKIN_BASE_URL
            value: "http://zipkin-service:9411/"
          - name: SPRING_CONFIG_IMPORT
