version: '3.8'

services:
  jenkins:
    # Usar imagen personalizada con Docker, kubectl y jq
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Montar el workspace del proyecto
      # En Windows, ajusta la ruta según tu sistema
      - .:/workspace:rw
      # Montar el socket de Docker del host para usar Docker directamente
      # En Windows con Docker Desktop, la ruta puede variar
      # Si no funciona, intenta con: /var/run/docker.sock:/var/run/docker.sock
      - /var/run/docker.sock:/var/run/docker.sock
      # Montar kubeconfig para acceso a Kubernetes
      # IMPORTANTE: En Windows, ajusta la ruta según tu usuario
      # Opción 1: Usar variable de entorno (Linux/Mac)
      # - ${HOME}/.kube:/root/.kube:rw
      # Opción 2: Usar ruta absoluta de Windows (ajusta el usuario)
      # - C:/Users/TuUsuario/.kube:/root/.kube:rw
      # Opción 3: Usar ruta actual (descomenta y ajusta):
      - C:/Users/Juan Diaz/.kube:/root/.kube:rw
      # Montar el perfil de minikube completo (necesario para los certificados)
      # IMPORTANTE: En Windows, ajusta la ruta según tu usuario
      # Opción 1: Usar variable de entorno (Linux/Mac)
      # - ${HOME}/.minikube:/root/.minikube:ro
      # Opción 2: Usar ruta absoluta de Windows (ajusta el usuario)
      # - C:/Users/TuUsuario/.minikube:/root/.minikube:ro
      # Opción 3: Usar ruta actual (descomenta y ajusta):
      - C:/Users/Juan Diaz/.minikube:/root/.minikube:ro
    environment:
      - JAVA_OPTS=-Xmx2048m -Xms512m
      - JENKINS_OPTS=--httpPort=8080
    networks:
      - jenkins-network
    restart: unless-stopped
    privileged: true

volumes:
  jenkins_home:

networks:
  jenkins-network:
    driver: bridge

