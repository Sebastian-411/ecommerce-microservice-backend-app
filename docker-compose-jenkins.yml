version: '3.8'

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins
    user: root
    privileged: true
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - .:/workspace:rw
      - /var/run/docker.sock:/var/run/docker.sock
      # Credenciales K8s desde el host (Windows):
      - ${USERPROFILE}/.kube:/root/.kube:ro
      - ${USERPROFILE}/.minikube:/root/.minikube:ro
    environment:
      - JAVA_OPTS=-Xmx2048m -Xms512m
      - JENKINS_OPTS=--httpPort=8080
      # Exponemos la URL del proxy para que el Jenkinsfile la use
      - KUBE_PROXY_URL=http://kubectl-proxy:8001
    networks:
      - jenkins-network
    restart: unless-stopped

  kubectl-proxy:
    image: bitnami/kubectl:latest
    container_name: kubectl-proxy
    # montamos las mismas credenciales del host
    volumes:
      - ${USERPROFILE}/.kube:/root/.kube:ro
      - ${USERPROFILE}/.minikube:/root/.minikube:ro
    command: >
      /bin/sh -lc '
      kubectl config use-context minikube &&
      kubectl proxy --port=8001 --address=0.0.0.0 --accept-hosts=".*"
      '
    networks:
      - jenkins-network
    restart: unless-stopped
    # no hace falta publicar el puerto al host; con la red interna basta

volumes:
  jenkins_home:

networks:
  jenkins-network:
    driver: bridge