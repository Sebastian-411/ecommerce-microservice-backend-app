name: CI/CD - STAGING Deploy (Build, Tests & Deploy)

on:
  push:
    branches:
      - staging
  workflow_dispatch:

env:
  ENVIRONMENT: stage
  PROJECT_VERSION: ${{ github.run_number }}
  JAVA_VERSION: '11'
  MAVEN_OPTS: '-Xmx3072m -XX:MaxPermSize=512m'
  
  # Azure AKS configuración
  KUBECTL_NAMESPACE: 'ecommerce-stage'
  AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP || 'ecommerce-rg' }}
  AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME || 'ecommerce-aks' }}
  
  # Docker registry - Docker Hub
  DOCKER_REGISTRY: 'docker.io'
  
  # Servicios
  INFRASTRUCTURE_SERVICES: 'service-discovery,cloud-config'
  CORE_SERVICES: 'api-gateway,proxy-client'
  BUSINESS_SERVICES: 'user-service,product-service,favourite-service,order-service,payment-service,shipping-service'

jobs:
  build-and-deploy:
    name: Build, Deploy & Test - STAGING (Push)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    # Permisos necesarios para Docker y Kubernetes
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      
      - name: Set Git Commit Short
        id: git_commit
        run: |
          GIT_COMMIT_SHORT=$(git rev-parse --short HEAD 2>/dev/null || echo "N/A")
          echo "commit_short=$GIT_COMMIT_SHORT" >> $GITHUB_OUTPUT
          echo "GIT_COMMIT_SHORT=$GIT_COMMIT_SHORT" >> $GITHUB_ENV
      
      - name: Preparación del Entorno
        run: |
          echo "=========================================="
          echo "Pipeline STAGING - Build, Deploy & Test"
          echo "=========================================="
          echo "Build: ${{ env.PROJECT_VERSION }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Env: ${{ env.ENVIRONMENT }}"
          echo "Azure AKS Cluster: ${{ env.AKS_CLUSTER_NAME }}"
          echo "Azure Resource Group: ${{ env.AKS_RESOURCE_GROUP }}"
          echo "Namespace: ${{ env.KUBECTL_NAMESPACE }}"
          echo "Docker Registry: ${{ env.DOCKER_REGISTRY }}"
          echo "=========================================="
          
          echo ""
          echo "Verificando herramientas..."
          ./mvnw --version || echo "⚠️  mvnw no disponible"
          
          docker --version
          docker ps >/dev/null 2>&1 || echo "⚠️  Docker CLI sin acceso al daemon"
          
          kubectl version --client || echo "⚠️  kubectl no disponible"
          kustomize version || echo "⚠️  kustomize no disponible"
          
          echo ""
          echo "Este workflow ejecuta build, tests y despliegue completo a Azure AKS"
      
      - name: Validación y Pruebas (setup) - Paralelo
        run: |
          # Ejecutar validación e instalación del padre en paralelo usando background jobs
          ./mvnw validate -q || true &
          VALIDATE_PID=$!
          
          ./mvnw clean install -N -q &
          INSTALL_PID=$!
          
          # Esperar a que ambos terminen
          wait $VALIDATE_PID
          wait $INSTALL_PID
      
      - name: Pruebas Unitarias y Cobertura
        run: |
          echo "Ejecutando Unitarias + JaCoCo (≥50%)"
          set -e
          failed=0
          for service in user-service product-service order-service favourite-service payment-service shipping-service; do
            echo ">>> $service"
            if ./mvnw -q -pl "$service" clean test jacoco:report verify; then
              echo "✅ $service OK"
            else
              echo "❌ $service FAIL"; failed=$((failed+1))
            fi
          done
          [ $failed -eq 0 ] || { echo "❌ $failed servicio(s) no cumplen"; exit 1; }
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/target/surefire-reports/TEST-*.xml
          retention-days: 10
          if-no-files-found: ignore
      
      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            **/target/site/jacoco/**/*
          retention-days: 10
          if-no-files-found: ignore
      
      - name: Construcción de Artefactos
        run: |
          set -e
          ./mvnw clean package -DskipTests
          find . -name "*.jar" -path "*/target/*" -not -name "*-original.jar" | sort
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jar-artifacts
          path: |
            **/target/*.jar
            !**/target/*-original.jar
          retention-days: 10
          if-no-files-found: error
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          registry: ${{ env.DOCKER_REGISTRY }}
      
      - name: Construcción de Imágenes Docker
        env:
          ALL_SERVICES: ${{ env.INFRASTRUCTURE_SERVICES }},${{ env.CORE_SERVICES }},${{ env.BUSINESS_SERVICES }}
        run: |
          set -e
          ALL_SERVICES="${{ env.INFRASTRUCTURE_SERVICES }},${{ env.CORE_SERVICES }},${{ env.BUSINESS_SERVICES }}"
          DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
          
          for svc in $(echo "$ALL_SERVICES" | tr ',' ' '); do
            echo "Docker build: $svc"
            IMAGE_NAME="${DOCKER_USERNAME}/$svc-ecommerce-boot"
            
            docker build \
              -t "${IMAGE_NAME}:${{ env.PROJECT_VERSION }}" \
              -t "${IMAGE_NAME}:latest" \
              --build-arg PROJECT_VERSION="${{ env.PROJECT_VERSION }}" \
              -f "$svc/Dockerfile" .
          done
      
      - name: Push de Imágenes Docker a Docker Hub
        env:
          ALL_SERVICES: ${{ env.INFRASTRUCTURE_SERVICES }},${{ env.CORE_SERVICES }},${{ env.BUSINESS_SERVICES }}
        run: |
          set -e
          ALL_SERVICES="${{ env.INFRASTRUCTURE_SERVICES }},${{ env.CORE_SERVICES }},${{ env.BUSINESS_SERVICES }}"
          DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
          
          # Push a Docker Hub (solo en ramas específicas)
          if [[ "${{ github.ref_name }}" == "develop" || "${{ github.ref_name }}" == "stage" || "${{ github.ref_name }}" == "staging" || "${{ github.ref_name }}" == "main" ]]; then
            for svc in $(echo "$ALL_SERVICES" | tr ',' ' '); do
              IMAGE_NAME="${DOCKER_USERNAME}/$svc-ecommerce-boot"
              echo "Push imagen a Docker Hub: $svc"
              
              # Push con retry para cada tag
              for tag in "${{ env.PROJECT_VERSION }}" "latest"; do
                for attempt in 1 2 3; do
                  if docker push "${IMAGE_NAME}:${tag}" 2>&1; then
                    echo "✅ Push exitoso: $svc:${tag}"
                    break
                  else
                    echo "⚠️  Intento $attempt falló para $svc:${tag}"
                    if [ $attempt -eq 3 ]; then
                      echo "❌ Push falló después de 3 intentos para $svc:${tag}"
                      exit 1
                    fi
                    sleep 2
                  fi
                done
              done
            done
          else
            echo "Push a Docker Hub omitido (no es rama develop/stage/staging/main)"
          fi
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      
      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.0.0'
      
      - name: Install kubelogin
        run: |
          echo "Instalando kubelogin..."
          KUBELOGIN_VERSION="v0.0.28"
          
          # Descargar y extraer kubelogin
          curl -LO "https://github.com/Azure/kubelogin/releases/download/${KUBELOGIN_VERSION}/kubelogin-linux-amd64.zip"
          unzip -q kubelogin-linux-amd64.zip
          chmod +x bin/linux_amd64/kubelogin
          sudo mv bin/linux_amd64/kubelogin /usr/local/bin/
          
          # Verificar instalación
          kubelogin --version
          echo "✅ kubelogin instalado correctamente"
      
      - name: Set AKS context (native)
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}
          use-kubelogin: true
      
      - name: Set Kubernetes Namespace
        run: |
          kubectl config set-context --current --namespace=${{ env.KUBECTL_NAMESPACE }}
      
      - name: Despliegue en Kubernetes (Staging)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_TAG: latest
        shell: bash
        run: |
          set -euo pipefail
          
          NS="${{ env.KUBECTL_NAMESPACE }}"
          echo "Creando namespace ${NS} si no existe…"
          kubectl create namespace "${NS}" --dry-run=client -o yaml | kubectl apply -f -
          
          echo "Reemplazando placeholders en kustomization.yaml con Docker Hub..."
          sed -i "s|DOCKER_USERNAME|${DOCKER_USERNAME}|g" k8s/stage/kustomization.yaml
          sed -i "s|IMAGE_TAG|${IMAGE_TAG}|g" k8s/stage/kustomization.yaml
          
          # (Opcional, recomendado) evitar rate-limit de Docker Hub con imagePullSecret
          if [[ -n "${DOCKER_USERNAME:-}" && -n "${DOCKER_PASSWORD:-}" ]]; then
            echo "Creando/actualizando imagePullSecret 'regcred'..."
            kubectl -n "${NS}" create secret docker-registry regcred \
              --docker-server=index.docker.io \
              --docker-username="${DOCKER_USERNAME}" \
              --docker-password="${DOCKER_PASSWORD}" \
              --dry-run=client -o yaml | kubectl apply -f -
            
            # Añadir regcred a todos los Deployments conocidos (ignora errores si alguno no existe)
            for d in api-gateway cloud-config favourite-service order-service payment-service product-service proxy-client service-discovery shipping-service user-service zipkin-service; do
              kubectl -n "${NS}" patch deploy "$d" --type='json' \
                -p='[{"op":"add","path":"/spec/template/spec/imagePullSecrets","value":[{"name":"regcred"}]}]' || true
            done
          fi
          
          echo "Aplicando k8s/stage con kustomize (LoadRestrictionsNone)…"
          kustomize build --load-restrictor=LoadRestrictionsNone k8s/stage/ \
            | kubectl -n "${NS}" apply -f - || {
              echo "⚠️  Error aplicando recursos, mostrando pods:"
              kubectl -n "${NS}" get pods || true
            }
          
          echo "Restaurando kustomization.yaml..."
          git checkout -- k8s/stage/kustomization.yaml || true
          
          # ===== Espera robusta: SOLO core con rollout status =====
          CORE_DEPLOYS=(service-discovery cloud-config api-gateway user-service product-service)
          
          echo "⏳ Esperando rollout de despliegues CORE en ${NS}..."
          for d in "${CORE_DEPLOYS[@]}"; do
            echo "• wait Available: $d"
            if ! kubectl -n "${NS}" wait deploy/"$d" --for=condition=Available --timeout=10m; then
              echo "❌ $d no alcanzó Available. Diagnosticando…"
              kubectl -n "${NS}" describe deploy "$d" || true
              P=$(kubectl -n "${NS}" get pods -l app="$d" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
              if [[ -n "${P:-}" ]]; then
                echo "----- describe $P -----"
                kubectl -n "${NS}" describe pod "$P" | sed -n '/Events/,$p' || true
                echo "----- logs $P -----"
                kubectl -n "${NS}" logs "$P" --all-containers --tail=200 || true
              fi
              exit 1
            fi
          done
          
          echo "📊 Estado de Deployments:"
          kubectl -n "${NS}" get deploy -o custom-columns=NAME:.metadata.name,AVAILABLE:.status.availableReplicas,DESIRED:.spec.replicas --no-headers | sort || true
          
          echo "📦 Pods (wide):"
          kubectl -n "${NS}" get pods -o wide || true
          
          echo "🔎 Revisando pods problemáticos…"
          BAD=$(kubectl -n "${NS}" get pods --no-headers 2>/dev/null | egrep -i 'CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerError|OOMKilled|ContainerStatusUnknown' | awk '{print $1}' || true)
          PENDING=$(kubectl -n "${NS}" get pods --field-selector=status.phase=Pending --no-headers 2>/dev/null | awk '{print $1}' || true)
          
          if [[ -n "${BAD:-}" ]]; then
            echo "❌ Pods en error:"
            echo "$BAD" | sed 's/^/   - /'
            for p in $BAD; do
              echo "----- describe $p -----"
              kubectl -n "${NS}" describe pod "$p" | sed -n '/Events/,$p' || true
              echo "----- logs $p -----"
              kubectl -n "${NS}" logs "$p" --all-containers --tail=200 || true
            done
            exit 1
          fi
          
          if [[ -n "${PENDING:-}" ]]; then
            echo "⚠️ Pods en Pending (falta CPU/RAM/IPs o requests altos):"
            echo "$PENDING" | sed 's/^/   - /'
            one=$(echo "$PENDING" | head -n1)
            if [[ -n "${one:-}" ]]; then
              echo "----- describe $one -----"
              kubectl -n "${NS}" describe pod "$one" | sed -n '/Events/,$p' || true
            fi
            echo "Tip: escala el cluster (az aks scale ... --node-count 2) o baja recursos/replicas."
            # No hacemos exit 1 aquí: el CORE ya quedó listo.
          fi
          
          echo "🧠 Services y Endpoints:"
          kubectl -n "${NS}" get svc
          kubectl -n "${NS}" get endpoints || true
          
          echo "✅ Despliegue completado (CORE listo)."
      - name: Build Summary - Success
        if: success()
        run: |
          echo "=========================================="
          echo "Pipeline STAGING - ÉXITO"
          echo "=========================================="
          echo "Build: ${{ github.run_number }}"
          echo "Versión: ${{ env.PROJECT_VERSION }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ env.GIT_COMMIT_SHORT }}"
          echo "Env: ${{ env.ENVIRONMENT }}"
          echo "Azure AKS Cluster: ${{ env.AKS_CLUSTER_NAME }}"
          echo "Azure Resource Group: ${{ env.AKS_RESOURCE_GROUP }}"
          echo "K8s Namespace: ${{ env.KUBECTL_NAMESPACE }}"
          echo "Docker Registry: Docker Hub"
          echo "=========================================="
      
      - name: Build Summary - Failure
        if: failure()
        run: |
          echo "❌ Pipeline STAGING falló"
          set +e
          kubectl get pods -n "${{ env.KUBECTL_NAMESPACE }}" -o wide || true
          kubectl get events -n "${{ env.KUBECTL_NAMESPACE }}" --sort-by=.lastTimestamp | tail -n 40 || true
          echo "Tip: valida que las credenciales de Azure estén configuradas correctamente y que el cluster AKS sea accesible."

