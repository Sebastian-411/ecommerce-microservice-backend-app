name: CI/CD - STAGING Deploy (Build, Tests & Deploy)

on:
  push:
    branches:
      - staging
  workflow_dispatch:

env:
  ENVIRONMENT: stage
  PROJECT_VERSION: ${{ github.run_number }}
  JAVA_VERSION: '11'
  MAVEN_OPTS: '-Xmx3072m -XX:MaxPermSize=512m'
  
  # Azure AKS configuración
  KUBECTL_NAMESPACE: 'ecommerce-stage'
  AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP || 'ecommerce-rg' }}
  AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME || 'ecommerce-aks' }}
  
  # Docker registry - Docker Hub
  DOCKER_REGISTRY: 'docker.io'
  
  # Servicios
  INFRASTRUCTURE_SERVICES: 'service-discovery,cloud-config'
  CORE_SERVICES: 'api-gateway,proxy-client'
  BUSINESS_SERVICES: 'user-service,product-service,favourite-service,order-service,payment-service,shipping-service'

jobs:
  prepare:
    name: Prepare Environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: Set Git Commit Short
        id: git_commit
        run: |
          GIT_COMMIT_SHORT=$(git rev-parse --short HEAD 2>/dev/null || echo "N/A")
          echo "commit_short=$GIT_COMMIT_SHORT" >> $GITHUB_OUTPUT
          echo "GIT_COMMIT_SHORT=$GIT_COMMIT_SHORT" >> $GITHUB_ENV
      - name: Info Summary
        run: |
          echo "Build: ${{ env.PROJECT_VERSION }} | Branch: ${{ github.ref_name }} | Env: ${{ env.ENVIRONMENT }}"

  tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: Validate & Install Parent
        run: |
          ./mvnw validate -q || true &
          VALIDATE_PID=$!
          ./mvnw clean install -N -q &
          INSTALL_PID=$!
          wait $VALIDATE_PID
          wait $INSTALL_PID
      - name: Run Tests (business services)
        run: |
          set -e
          failed=0
          for service in user-service product-service order-service favourite-service payment-service shipping-service; do
            echo ">>> $service"
            if ./mvnw -q -pl "$service" clean test jacoco:report verify; then
              echo "✅ $service OK"
            else
              echo "❌ $service FAIL"; failed=$((failed+1))
            fi
          done
          [ $failed -eq 0 ] || { echo "❌ $failed servicio(s) no cumplen"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/target/surefire-reports/TEST-*.xml
          retention-days: 10
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            **/target/site/jacoco/**/*
          retention-days: 10
          if-no-files-found: ignore

  docker-build:
    name: Docker Build Images
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: Package services (create JARs)
        env:
          ALL_SERVICES: ${{ env.INFRASTRUCTURE_SERVICES }},${{ env.CORE_SERVICES }},${{ env.BUSINESS_SERVICES }}
        run: |
          set -e
          for svc in $(echo "$ALL_SERVICES" | tr ',' ' '); do
            echo "Packaging $svc"
            ./mvnw -q -pl "$svc" -am clean package -DskipTests
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          registry: ${{ env.DOCKER_REGISTRY }}
      - name: Build and push images
        env:
          ALL_SERVICES: ${{ env.INFRASTRUCTURE_SERVICES }},${{ env.CORE_SERVICES }},${{ env.BUSINESS_SERVICES }}
        run: |
          set -e
          ALL_SERVICES="${{ env.INFRASTRUCTURE_SERVICES }},${{ env.CORE_SERVICES }},${{ env.BUSINESS_SERVICES }}"
          DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
          for svc in $(echo "$ALL_SERVICES" | tr ',' ' '); do
            echo "Docker buildx build: $svc"
            IMAGE_NAME="${DOCKER_USERNAME}/$svc-ecommerce-boot"
            if [[ "${{ github.ref_name }}" == "develop" || "${{ github.ref_name }}" == "stage" || "${{ github.ref_name }}" == "staging" || "${{ github.ref_name }}" == "main" ]]; then
              docker buildx build \
                --push \
                -t "${IMAGE_NAME}:${{ env.PROJECT_VERSION }}" \
                -t "${IMAGE_NAME}:latest" \
                --build-arg PROJECT_VERSION="${{ env.PROJECT_VERSION }}" \
                -f "$svc/Dockerfile" .
            else
              docker buildx build \
                --load \
                -t "${IMAGE_NAME}:${{ env.PROJECT_VERSION }}" \
                -t "${IMAGE_NAME}:latest" \
                --build-arg PROJECT_VERSION="${{ env.PROJECT_VERSION }}" \
                -f "$svc/Dockerfile" .
            fi
          done

  

  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.0.0'

      - name: Install kubelogin
        run: |
          set -e
          KUBELOGIN_VERSION="v0.0.28"
          curl -LO "https://github.com/Azure/kubelogin/releases/download/${KUBELOGIN_VERSION}/kubelogin-linux-amd64.zip"
          unzip -q kubelogin-linux-amd64.zip
          sudo install -m 0755 bin/linux_amd64/kubelogin /usr/local/bin/kubelogin
          kubelogin --version

      - name: Set AKS context (native)
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}
          use-kubelogin: true

      - name: Set Kubernetes Namespace
        run: |
          kubectl create namespace "${{ env.KUBECTL_NAMESPACE }}" --dry-run=client -o yaml | kubectl apply -f -
          kubectl config set-context --current --namespace=${{ env.KUBECTL_NAMESPACE }}

      - name: Deploy manifests (kustomize)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_TAG: latest
        shell: bash
        run: |
          set -euo pipefail
          NS="${{ env.KUBECTL_NAMESPACE }}"
          # pull secret global en el SA por defecto (evitas parches por deploy)
          if [[ -n "${DOCKER_USERNAME:-}" && -n "${DOCKER_PASSWORD:-}" ]]; then
            kubectl -n "${NS}" create secret docker-registry regcred \
              --docker-server=index.docker.io \
              --docker-username="${DOCKER_USERNAME}" \
              --docker-password="${DOCKER_PASSWORD}" \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl -n "${NS}" patch serviceaccount default --type='merge' -p '{"imagePullSecrets":[{"name":"regcred"}]}' || true
          fi
          # templating
          sed -i "s|DOCKER_USERNAME|${DOCKER_USERNAME}|g" k8s/stage/kustomization.yaml
          sed -i "s|IMAGE_TAG|${IMAGE_TAG}|g" k8s/stage/kustomization.yaml
          kustomize build --load-restrictor=LoadRestrictionsNone k8s/stage/ | kubectl apply -n "${NS}" -f - || true
          git checkout -- k8s/stage/kustomization.yaml || true

      - name: Pre-flight de capacidad (CPU/Mem)
        shell: bash
        run: |
          set -e
          NS="${{ env.KUBECTL_NAMESPACE }}"
          # Suma requests de todos los containers del namespace
          REQ_CPU=$(kubectl -n "$NS" get pods --no-headers -o json \
            | jq -r '[.items[].spec.containers[].resources.requests.cpu // "0"] 
              | map(gsub("m$";"")) 
              | map( if test("^[0-9]+$") then .|tonumber else ( .|sub("n$";"")|tonumber/1000000 ) end )
              | add // 0' )
          REQ_MEM=$(kubectl -n "$NS" get pods --no-headers -o json \
            | jq -r '[.items[].spec.containers[].resources.requests.memory // "0"] 
              | map( if test("Mi$") then (.|sub("Mi$";"")|tonumber) 
                      elif test("Gi$") then (.|sub("Gi$";"")|tonumber*1024) 
                      else 0 end) 
              | add // 0' )
          # Capacidad allocatable del cluster
          ALLOC_CPU=$(kubectl get nodes -o json \
            | jq -r '[.items[].status.allocatable.cpu]
              | map(gsub("m$";""))
              | map( if test("^[0-9]+$") then .|tonumber*1000 else .|tonumber end )
              | add' )
          ALLOC_MEM=$(kubectl get nodes -o json \
            | jq -r '[.items[].status.allocatable.memory]
              | map( if test("Ki$") then (.|sub("Ki$";"")|tonumber/1024) 
                      elif test("Mi$") then (.|sub("Mi$";"")|tonumber) 
                      elif test("Gi$") then (.|sub("Gi$";"")|tonumber*1024) 
                      else 0 end )
              | add' )
          echo "Requests CPU (m): $REQ_CPU  / Allocatable CPU (m): $ALLOC_CPU"
          echo "Requests Mem (Mi): $REQ_MEM / Allocatable Mem (Mi): $ALLOC_MEM"
          # Si ya no alcanza, falla acá con mensaje claro
          if (( REQ_CPU > ALLOC_CPU )) || (( REQ_MEM > ALLOC_MEM )); then
            echo "❌ No hay capacidad suficiente en el cluster para los requests actuales."
            echo "Sugerencias: baja replicas/requests en stage o sube node count/size."
            exit 1
          fi

      - name: Rollout con diagnóstico (core)
        shell: bash
        run: |
          set -e
          NS="${{ env.KUBECTL_NAMESPACE }}"
          CORE_DEPLOYS=(service-discovery cloud-config api-gateway user-service product-service)
          for d in "${CORE_DEPLOYS[@]}"; do
            echo "• wait Available: $d"
            if ! kubectl -n "$NS" wait deploy/"$d" --for=condition=Available --timeout=10m; then
              echo "❌ $d no llegó a Available. Diagnosticando…"
              kubectl -n "$NS" get deploy/"$d" -o wide || true
              kubectl -n "$NS" describe deploy/"$d" | tail -n +1 || true
              # pods del deploy
              PODS=($(kubectl -n "$NS" get po -l app="$d" -o name 2>/dev/null | sed 's|pod/||'))
              for p in "${PODS[@]}"; do
                echo "----- describe $p -----"
                kubectl -n "$NS" describe pod "$p" | tail -n +1 || true
                echo "----- logs $p (últimas 200) -----"
                kubectl -n "$NS" logs "$p" --tail=200 --all-containers || true
              done
              exit 1
            fi
          done

      - name: Post-deploy diagnostics
        if: always()
        run: |
          NS="${{ env.KUBECTL_NAMESPACE }}"
          kubectl -n "${NS}" get deploy -o custom-columns=NAME:.metadata.name,AVAILABLE:.status.availableReplicas,DESIRED:.spec.replicas --no-headers | sort || true
          kubectl -n "${NS}" get pods -o wide || true
          kubectl -n "${NS}" get svc || true
