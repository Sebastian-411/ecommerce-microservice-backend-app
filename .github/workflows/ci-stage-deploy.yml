name: CI/CD - STAGING Deploy (Build, Tests & Deploy)

on:
  push:
    branches:
      - staging
  workflow_dispatch:

env:
  ENVIRONMENT: stage
  PROJECT_VERSION: ${{ github.run_number }}
  JAVA_VERSION: '11'
  MAVEN_OPTS: '-Xmx3072m -XX:MaxPermSize=512m'
  
  # Azure AKS configuración
  KUBECTL_NAMESPACE: 'ecommerce-stage'
  AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP || 'ecommerce-rg' }}
  AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME || 'ecommerce-aks' }}
  
  # Docker registry - Docker Hub
  DOCKER_REGISTRY: 'docker.io'
  
  # Servicios
  INFRASTRUCTURE_SERVICES: 'service-discovery,cloud-config'
  CORE_SERVICES: 'api-gateway,proxy-client'
  BUSINESS_SERVICES: 'user-service,product-service,favourite-service,order-service,payment-service,shipping-service'

jobs:
  prepare:
    name: Prepare Environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: Set Git Commit Short
        id: git_commit
        run: |
          GIT_COMMIT_SHORT=$(git rev-parse --short HEAD 2>/dev/null || echo "N/A")
          echo "commit_short=$GIT_COMMIT_SHORT" >> $GITHUB_OUTPUT
          echo "GIT_COMMIT_SHORT=$GIT_COMMIT_SHORT" >> $GITHUB_ENV
      - name: Info Summary
        run: |
          echo "Build: ${{ env.PROJECT_VERSION }} | Branch: ${{ github.ref_name }} | Env: ${{ env.ENVIRONMENT }}"

  tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: Validate & Install Parent
        run: |
          ./mvnw validate -q || true &
          VALIDATE_PID=$!
          ./mvnw clean install -N -q &
          INSTALL_PID=$!
          wait $VALIDATE_PID
          wait $INSTALL_PID
      - name: Run Tests (business services)
        run: |
          set -e
          failed=0
          for service in user-service product-service order-service favourite-service payment-service shipping-service; do
            echo ">>> $service"
            if ./mvnw -q -pl "$service" clean test jacoco:report verify; then
              echo "✅ $service OK"
            else
              echo "❌ $service FAIL"; failed=$((failed+1))
            fi
          done
          [ $failed -eq 0 ] || { echo "❌ $failed servicio(s) no cumplen"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/target/surefire-reports/TEST-*.xml
          retention-days: 10
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            **/target/site/jacoco/**/*
          retention-days: 10
          if-no-files-found: ignore

  docker-build:
    name: Docker Build Images
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          registry: ${{ env.DOCKER_REGISTRY }}
      - name: Build images
        env:
          ALL_SERVICES: ${{ env.INFRASTRUCTURE_SERVICES }},${{ env.CORE_SERVICES }},${{ env.BUSINESS_SERVICES }}
        run: |
          set -e
          ALL_SERVICES="${{ env.INFRASTRUCTURE_SERVICES }},${{ env.CORE_SERVICES }},${{ env.BUSINESS_SERVICES }}"
          DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
          for svc in $(echo "$ALL_SERVICES" | tr ',' ' '); do
            echo "Docker build: $svc"
            IMAGE_NAME="${DOCKER_USERNAME}/$svc-ecommerce-boot"
            docker build \
              -t "${IMAGE_NAME}:${{ env.PROJECT_VERSION }}" \
              -t "${IMAGE_NAME}:latest" \
              --build-arg PROJECT_VERSION="${{ env.PROJECT_VERSION }}" \
              -f "$svc/Dockerfile" .
          done

  docker-push:
    name: Docker Push Images
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          registry: ${{ env.DOCKER_REGISTRY }}
      - name: Push images
        env:
          ALL_SERVICES: ${{ env.INFRASTRUCTURE_SERVICES }},${{ env.CORE_SERVICES }},${{ env.BUSINESS_SERVICES }}
        run: |
          set -e
          ALL_SERVICES="${{ env.INFRASTRUCTURE_SERVICES }},${{ env.CORE_SERVICES }},${{ env.BUSINESS_SERVICES }}"
          DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
          if [[ "${{ github.ref_name }}" == "develop" || "${{ github.ref_name }}" == "stage" || "${{ github.ref_name }}" == "staging" || "${{ github.ref_name }}" == "main" ]]; then
            for svc in $(echo "$ALL_SERVICES" | tr ',' ' '); do
              IMAGE_NAME="${DOCKER_USERNAME}/$svc-ecommerce-boot"
              echo "Push imagen a Docker Hub: $svc"
              for tag in "${{ env.PROJECT_VERSION }}" "latest"; do
                for attempt in 1 2 3; do
                  if docker push "${IMAGE_NAME}:${tag}" 2>&1; then
                    echo "✅ Push exitoso: $svc:${tag}"
                    break
                  else
                    echo "⚠️  Intento $attempt falló para $svc:${tag}"
                    if [ $attempt -eq 3 ]; then
                      echo "❌ Push falló después de 3 intentos para $svc:${tag}"
                      exit 1
                    fi
                    sleep 2
                  fi
                done
              done
            done
          else
            echo "Push a Docker Hub omitido (no es rama develop/stage/staging/main)"
          fi

  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: docker-push
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.0.0'
      - name: Install kubelogin
        run: |
          set -e
          KUBELOGIN_VERSION="v0.0.28"
          curl -LO "https://github.com/Azure/kubelogin/releases/download/${KUBELOGIN_VERSION}/kubelogin-linux-amd64.zip"
          unzip -q kubelogin-linux-amd64.zip
          chmod +x bin/linux_amd64/kubelogin
          sudo mv bin/linux_amd64/kubelogin /usr/local/bin/
          kubelogin --version
      - name: Set AKS context (native)
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}
          use-kubelogin: true
      - name: Set Kubernetes Namespace
        run: |
          kubectl config set-context --current --namespace=${{ env.KUBECTL_NAMESPACE }}
      - name: Deploy manifests (kustomize)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_TAG: latest
        shell: bash
        run: |
          set -euo pipefail
          NS="${{ env.KUBECTL_NAMESPACE }}"
          kubectl create namespace "${NS}" --dry-run=client -o yaml | kubectl apply -f -
          sed -i "s|DOCKER_USERNAME|${DOCKER_USERNAME}|g" k8s/stage/kustomization.yaml
          sed -i "s|IMAGE_TAG|${IMAGE_TAG}|g" k8s/stage/kustomization.yaml
          if [[ -n "${DOCKER_USERNAME:-}" && -n "${DOCKER_PASSWORD:-}" ]]; then
            kubectl -n "${NS}" create secret docker-registry regcred \
              --docker-server=index.docker.io \
              --docker-username="${DOCKER_USERNAME}" \
              --docker-password="${DOCKER_PASSWORD}" \
              --dry-run=client -o yaml | kubectl apply -f -
            for d in api-gateway cloud-config favourite-service order-service payment-service product-service proxy-client service-discovery shipping-service user-service zipkin-service; do
              kubectl -n "${NS}" patch deploy "$d" --type='json' \
                -p='[{"op":"add","path":"/spec/template/spec/imagePullSecrets","value":[{"name":"regcred"}]}]' || true
            done
          fi
          kustomize build --load-restrictor=LoadRestrictionsNone k8s/stage/ | kubectl -n "${NS}" apply -f - || {
            echo "⚠️  Error aplicando recursos, mostrando pods:"; kubectl -n "${NS}" get pods || true; }
          git checkout -- k8s/stage/kustomization.yaml || true
      - name: Wait for core rollouts
        run: |
          set -e
          NS="${{ env.KUBECTL_NAMESPACE }}"
          CORE_DEPLOYS=(service-discovery cloud-config api-gateway user-service product-service)
          for d in "${CORE_DEPLOYS[@]}"; do
            echo "• wait Available: $d"
            kubectl -n "${NS}" wait deploy/"$d" --for=condition=Available --timeout=10m
          done
      - name: Post-deploy diagnostics
        if: always()
        run: |
          NS="${{ env.KUBECTL_NAMESPACE }}"
          kubectl -n "${NS}" get deploy -o custom-columns=NAME:.metadata.name,AVAILABLE:.status.availableReplicas,DESIRED:.spec.replicas --no-headers | sort || true
          kubectl -n "${NS}" get pods -o wide || true
          kubectl -n "${NS}" get svc || true
      - name: Build Summary - Success
        if: success()
        run: |
          echo "=========================================="
          echo "Pipeline STAGING - ÉXITO"
          echo "=========================================="
          echo "Build: ${{ github.run_number }}"
          echo "Versión: ${{ env.PROJECT_VERSION }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ env.GIT_COMMIT_SHORT }}"
          echo "Env: ${{ env.ENVIRONMENT }}"
          echo "Azure AKS Cluster: ${{ env.AKS_CLUSTER_NAME }}"
          echo "Azure Resource Group: ${{ env.AKS_RESOURCE_GROUP }}"
          echo "K8s Namespace: ${{ env.KUBECTL_NAMESPACE }}"
          echo "Docker Registry: Docker Hub"
          echo "=========================================="
      - name: Build Summary - Failure
        if: failure()
        run: |
          echo "❌ Pipeline STAGING falló"
          set +e
          kubectl get pods -n "${{ env.KUBECTL_NAMESPACE }}" -o wide || true
          kubectl get events -n "${{ env.KUBECTL_NAMESPACE }}" --sort-by=.lastTimestamp | tail -n 40 || true

