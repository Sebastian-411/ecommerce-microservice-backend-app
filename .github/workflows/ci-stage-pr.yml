name: CI - STAGING PR (Build & Tests)

on:
  pull_request:
    branches:
      - staging

env:
  ENVIRONMENT: stage
  PROJECT_VERSION: ${{ github.run_number }}
  JAVA_VERSION: '11'
  MAVEN_OPTS: '-Xmx3072m -XX:MaxPermSize=512m'
  
  # Servicios
  INFRASTRUCTURE_SERVICES: 'service-discovery,cloud-config'
  CORE_SERVICES: 'api-gateway,proxy-client'
  BUSINESS_SERVICES: 'user-service,product-service,favourite-service,order-service,payment-service,shipping-service'

jobs:
  build-and-test:
    name: Build & Test - STAGING PR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      
      - name: Set Git Commit Short
        id: git_commit
        run: |
          GIT_COMMIT_SHORT=$(git rev-parse --short HEAD 2>/dev/null || echo "N/A")
          echo "commit_short=$GIT_COMMIT_SHORT" >> $GITHUB_OUTPUT
          echo "GIT_COMMIT_SHORT=$GIT_COMMIT_SHORT" >> $GITHUB_ENV
      
      - name: Preparación del Entorno
        run: |
          echo "=========================================="
          echo "Pipeline STAGING PR - Build & Tests"
          echo "=========================================="
          echo "Build: ${{ env.PROJECT_VERSION }}"
          echo "PR: ${{ github.event.pull_request.number }}"
          echo "Branch: ${{ github.head_ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Env: ${{ env.ENVIRONMENT }}"
          echo "=========================================="
          
          echo ""
          echo "Verificando herramientas..."
          ./mvnw --version || echo "⚠️  mvnw no disponible"
      
      - name: Validación y Pruebas (setup) - Paralelo
        run: |
          # Ejecutar validación e instalación del padre en paralelo usando background jobs
          ./mvnw validate -q || true &
          VALIDATE_PID=$!
          
          ./mvnw clean install -N -q &
          INSTALL_PID=$!
          
          # Esperar a que ambos terminen
          wait $VALIDATE_PID
          wait $INSTALL_PID
      
      - name: Pruebas Unitarias y Cobertura
        run: |
          echo "Ejecutando Unitarias + JaCoCo (≥50%)"
          set -e
          failed=0
          for service in user-service product-service order-service favourite-service payment-service shipping-service; do
            echo ">>> $service"
            if ./mvnw -q -pl "$service" clean test jacoco:report verify; then
              echo "✅ $service OK"
            else
              echo "❌ $service FAIL"; failed=$((failed+1))
            fi
          done
          [ $failed -eq 0 ] || { echo "❌ $failed servicio(s) no cumplen"; exit 1; }
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-pr-${{ github.event.pull_request.number }}
          path: |
            **/target/surefire-reports/TEST-*.xml
          retention-days: 10
          if-no-files-found: ignore
      
      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports-pr-${{ github.event.pull_request.number }}
          path: |
            **/target/site/jacoco/**/*
          retention-days: 10
          if-no-files-found: ignore
      
      - name: Construcción de Artefactos
        run: |
          set -e
          ./mvnw clean package -DskipTests
          find . -name "*.jar" -path "*/target/*" -not -name "*-original.jar" | sort
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jar-artifacts-pr-${{ github.event.pull_request.number }}
          path: |
            **/target/*.jar
            !**/target/*-original.jar
          retention-days: 10
          if-no-files-found: error
      
      - name: Build Validation
        run: |
          echo "=========================================="
          echo "Validando construcción..."
          echo "=========================================="
          
          # Verificar que los artefactos principales fueron generados
          missing=0
          
          for service in service-discovery cloud-config api-gateway proxy-client user-service product-service favourite-service order-service payment-service shipping-service; do
            jar_file=$(find ${service}/target -name "${service}-v*.jar" -not -name "*-original.jar" 2>/dev/null | head -1)
            if [ -f "$jar_file" ]; then
              echo "${service}: $(basename $jar_file)"
            else
              echo "${service}: JAR no encontrado"
              missing=$((missing + 1))
            fi
          done
          
          if [ $missing -gt 0 ]; then
            echo ""
            echo "Advertencia: $missing servicio(s) sin JAR generado"
            exit 1
          else
            echo ""
            echo "Todos los microservicios fueron construidos exitosamente"
          fi
      
      - name: Build Summary - Success
        if: success()
        run: |
          echo "=========================================="
          echo "Pipeline STAGING PR - ÉXITO"
          echo "=========================================="
          echo "Build: ${{ github.run_number }}"
          echo "Versión: ${{ env.PROJECT_VERSION }}"
          echo "PR: ${{ github.event.pull_request.number }}"
          echo "Branch: ${{ github.head_ref }}"
          echo "Commit: ${{ env.GIT_COMMIT_SHORT }}"
          echo "Env: ${{ env.ENVIRONMENT }}"
          echo "=========================================="
          echo "✅ Build y tests completados exitosamente"
          echo "=========================================="
      
      - name: Build Summary - Failure
        if: failure()
        run: |
          echo "❌ Pipeline STAGING PR falló"
          echo "Revisa los logs de build y tests para más detalles."

